<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BuscaPreço - Comparador de Supermercados, Eletros e Veículos</title>
    <meta name="description" content="Comparador inteligente de preços em supermercados, eletrodomésticos, veículos, autopeças e postos de combustível com rotas inteligentes e IA." />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BuscaPreço" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="BuscaPreço - Comparador Inteligente de Preços" />
    <meta property="og:description" content="Compare preços em tempo real com rotas GPS, cálculo de combustível, Selo Procel de eletros e Tabela FIPE." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-stone-100 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration for PWA -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[BuscaPreço PWA] Service Worker registrado com sucesso:', reg.scope);
            })
            .catch((err) => {
              console.log('[BuscaPreço PWA] Falha ao registrar Service Worker:', err);
            });
        });

        // Quando uma nova versão do Service Worker assume o controle da página
        // (por exemplo, depois de um novo deploy), recarrega a página automaticamente
        // uma única vez para que o usuário sempre veja a versão mais recente do app,
        // sem precisar fechar e abrir de novo manualmente.
        let hasReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hasReloaded) return;
          hasReloaded = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
